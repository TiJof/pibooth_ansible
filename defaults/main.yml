pibooth_prereqs: python3-opencv,cups,libcups2-dev,python3-opencv,libsdl2-ttf-2.0-0,vim,python3-gphoto2,libsdl2-dev,libsdl2-ttf-dev,libsdl2-image-dev,libportmidi-dev,libsdl2-mixer-dev,incron,python3-pip,feh
pibooth_prereqs_no: gvfs-backends
# pibooth_pip: pibooth[slr,printer],pibooth-extra-lights,pibooth-picture-template,pibooth-qrcode
pibooth_pip: /tmp/pibooth,pibooth-extra-lights,pibooth-picture-template,pibooth-qrcode,pycups-notify
pibooth_user: pi
pibooth_git: https://github.com/pibooth/pibooth
pibooth_version: 2.0.8

pibooth_general_pibooth_language: fr
pibooth_general_pibooth_directory: ~{{ pibooth_user }}/Pictures/pibooth
pibooth_general_pibooth_autostart: "False"
pibooth_general_pibooth_debug: "False"
pibooth_general_pibooth_plugins:
pibooth_general_pibooth_plugins_disabled:
pibooth_general_pibooth_vkeyboard: "False"
pibooth_window_pibooth_size: fullscreen
pibooth_window_pibooth_background: (0, 0, 0)
pibooth_window_pibooth_text_color: (255, 255, 255)
pibooth_window_pibooth_flash: "True"
pibooth_window_pibooth_animate: "True"
pibooth_window_pibooth_animate_delay: 0.2
pibooth_window_pibooth_finish_image_delay: 10
pibooth_window_pibooth_wait_picture_delay: -1
pibooth_window_pibooth_chosen_delay: 4
pibooth_window_pibooth_arrows: top
pibooth_window_pibooth_arrows_x_offset: 0
pibooth_window_pibooth_preview_delay: 3
pibooth_window_pibooth_preview_countdown: "True"
pibooth_window_pibooth_preview_stop_on_capture: "False"
pibooth_picture_pibooth_orientation: auto
pibooth_picture_pibooth_captures: (4, 1)
pibooth_picture_pibooth_captures_effects: none
pibooth_picture_pibooth_captures_cropping: "False"
pibooth_picture_pibooth_margin_thick: 100
pibooth_picture_pibooth_footer_text1: 10 ans
pibooth_picture_pibooth_footer_text2: Aurélia et Geoffroy
pibooth_picture_pibooth_text_colors: (0, 0, 0)
pibooth_picture_pibooth_text_fonts: ('Amatic-Bold', 'AmaticSC-Regular')
pibooth_picture_pibooth_text_alignments: center
pibooth_picture_pibooth_overlays:
pibooth_picture_pibooth_backgrounds: (255, 255, 255)
pibooth_picture_pibooth_template: picture_template.xml
pibooth_camera_pibooth_iso: 100
pibooth_camera_pibooth_flip: "False"
pibooth_camera_pibooth_rotation: 0
pibooth_camera_pibooth_resolution: (1934, 2464)
pibooth_camera_pibooth_delete_internal_memory: "False"
pibooth_printer_pibooth_printer_name: default
pibooth_printer_pibooth_printer_options: {}
pibooth_printer_pibooth_printer_delay: 10
pibooth_printer_pibooth_auto_print: 0
pibooth_printer_pibooth_max_pages: -1
pibooth_printer_pibooth_max_duplicates: 2
pibooth_printer_pibooth_pictures_per_page: 1
pibooth_controls_pibooth_debounce_delay: 0.3
pibooth_controls_pibooth_multi_press_delay: 0.5
pibooth_controls_pibooth_picture_btn_pin: 11
pibooth_controls_pibooth_picture_led_pin: 7
pibooth_controls_pibooth_print_btn_pin: 13
pibooth_controls_pibooth_print_led_pin: 15
pibooth_controls_pibooth_startup_led_pin: 29
pibooth_controls_pibooth_preview_led_pin: 31
pibooth_controls_pibooth_flash_led_pin: 33
pibooth_qrcode_pibooth_prefix_url: http://{{ client_login }}.{{ domain }}/public/{picture}
pibooth_qrcode_pibooth_foreground: (255, 255, 255)
pibooth_qrcode_pibooth_background: (0, 0, 0)
pibooth_qrcode_pibooth_side_text: Scannez-moi
pibooth_qrcode_pibooth_offset: (20, 40)
pibooth_qrcode_pibooth_wait_location: bottomleft
pibooth_qrcode_pibooth_print_location: bottomright
